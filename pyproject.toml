[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "elvia"
version = "0.1.0a1"
description = "Offline, versioned proposition evidence records"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSES/CC-BY-4.0.txt", "NOTICE.md"]
authors = [{name = "Minhao Liu"}]
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
website = ["google-auth[requests]>=2.38,<3", "tzdata>=2025.1", "waitress>=3,<4"]

[project.urls]
Repository = "https://github.com/chineseschrodingercat/elvia"
Issues = "https://github.com/chineseschrodingercat/elvia/issues"

[project.scripts]
elvia = "elvia.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9", "build>=1.2", "google-auth[requests]>=2.38,<3", "tzdata>=2025.1", "waitress>=3,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
elvia = ["schema/*.json", "web/*.html", "web/*.css", "web/*.js", "web/*.json", "web/*.woff2", "web/LICENSE-*.txt", "web/vendor/katex/*", "web/vendor/katex/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
extend-exclude = ["website/preview", "website/gateway", "website/scripts"]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
