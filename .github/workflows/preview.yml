name: Atlas preview

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  preview:
    name: atlas-preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
      - run: uv sync --locked --python 3.13
      - run: uv run --no-sync elvia validate studies/neurips2025/records
      - run: uv run --no-sync elvia validate studies/icml2025/records
      - run: node scripts/check_review_notes.cjs studies/neurips2025/records
      - run: node scripts/check_icml_format.cjs studies/icml2025
      - run: uv run --no-sync python -m website.build --output atlas-output
      - name: Upload static source preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-preview-${{ github.sha }}
          path: atlas-output/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
