name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
      - run: uv sync --locked --python 3.13
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - name: Exercise bundled math renderer and all reviewed expressions
        run: node --test tests/*.test.cjs website/preview/tests/*.test.*
      - name: Check the active collection's mathematical presentation
        run: node scripts/check_review_notes.cjs studies/neurips2025/records

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
      - run: uv sync --locked --python '${{ matrix.python }}'
      - name: Verify matrix interpreter
        run: uv run --no-sync python -c "import sys; assert '.'.join(map(str, sys.version_info[:2])) == '${{ matrix.python }}'; print(sys.version)"
      - run: uv run --no-sync pytest -q
      - name: Isolated website backend regression suite
        run: uv run --no-sync python website/preview/tests/run_private_auth_backend.py ci all
      - run: uv run --no-sync elvia validate examples/synthetic_demo/records
      - run: uv run --no-sync elvia validate studies/neurips2025/records
      - run: uv build
      - name: Install wheel with locked runtime dependencies and verify offline
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file wheel-requirements.txt
          uv venv --python '${{ matrix.python }}' wheel-venv
          wheel_python=wheel-venv/bin/python
          if [ -f wheel-venv/Scripts/python.exe ]; then
            wheel_python=wheel-venv/Scripts/python.exe
          fi
          uv pip sync --python "$wheel_python" wheel-requirements.txt
          uv pip install --python "$wheel_python" --no-deps dist/*.whl
          "$wheel_python" scripts/offline_smoke.py
