name: Software bug
description: Report a reproducible software failure using synthetic data.
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 'Use synthetic/minimal inputs. Do not post private sources, credentials or real-paper accusations. Security vulnerabilities: see SECURITY.md.'
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and observed behavior
      description: Include the exact command and minimal synthetic input.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Commit, OS, Python and uv versions
    validations:
      required: true
