name: Feature proposal
description: Propose a bounded software or workflow improvement.
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and intended user outcome
      description: Link existing work and avoid private scientific sources.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope and acceptance criteria
      description: State dependencies and a synthetic validation example.
    validations:
      required: true
